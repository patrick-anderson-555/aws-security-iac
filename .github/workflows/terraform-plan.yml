# Layer 2 of the IaC security gate.
#
# Runs on every PR touching Terraform code. Produces:
#   1. terraform fmt/validate/plan output   (correctness and formatting)
#   2. Checkov SARIF results                (security findings in the Security tab)
#   3. PR comment summarising findings       (reviewer convenience)

name: terraform-plan

on:
  pull_request:
    paths:
      - 'environments/**'
      - 'modules/**'

permissions:
  id-token: write        # required to request the OIDC token from GitHub
  contents: read         # required to check out the PR branch
  pull-requests: write   # required to post the plan summary as a PR comment
  security-events: write # required to upload Checkov SARIF to the Security tab

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'
  WORKING_DIR: environments/dev

jobs:
  plan:
    name: terraform plan + checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region:    ${{ vars.AWS_REGION }}
          role-session-name: gha-terraform-plan-${{ github.run_id }}

      - name: terraform fmt
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -lockfile=readonly

      - name: terraform validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: terraform plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan -out=tfplan -no-color -input=false
          terraform show -json tfplan > tfplan.json

      - name: Run Checkov against HCL
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.WORKING_DIR }}
          config_file: .checkov.yaml
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false
          quiet: true

      - name: Upload Checkov SARIF to GitHub Security tab
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: Post plan summary on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sarifPath = 'checkov.sarif';

            // Parse HCL files to map line numbers to Terraform resource
            // addresses. Brace-counting; strings/heredocs with literal
            // braces are a known edge case.
            function buildResourceMap(hclFiles) {
              const map = {};
              for (const file of hclFiles) {
                if (!fs.existsSync(file)) continue;
                const lines = fs.readFileSync(file, 'utf8').split('\n');
                const resources = [];
                let i = 0;
                while (i < lines.length) {
                  const m = lines[i].match(/^resource\s+"([^"]+)"\s+"([^"]+)"\s*\{/);
                  if (m) {
                    const address = `${m[1]}.${m[2]}`;
                    const startLine = i + 1;
                    let depth = 1;
                    let j = i;
                    while (depth > 0 && j < lines.length - 1) {
                      j++;
                      for (const ch of lines[j]) {
                        if (ch === '{') depth++;
                        else if (ch === '}') depth--;
                        if (depth === 0) break;
                      }
                    }
                    resources.push({ startLine, endLine: j + 1, address });
                    i = j + 1;
                  } else {
                    i++;
                  }
                }
                map[file] = resources;
              }
              return map;
            }

            function lookupAddress(resourceMap, file, line) {
              const resources = resourceMap[file] || [];
              for (const r of resources) {
                if (line >= r.startLine && line <= r.endLine) return r.address;
              }
              return '(unknown)';
            }

            let summary = '## Terraform plan + Checkov\n\n';

            // --- Checkov findings ---
            if (fs.existsSync(sarifPath)) {
              const sarif = JSON.parse(fs.readFileSync(sarifPath, 'utf8'));
              const allResults = (sarif.runs?.[0]?.results) || [];
              const rules      = (sarif.runs?.[0]?.tool?.driver?.rules) || [];
              const ruleById   = Object.fromEntries(rules.map(r => [r.id, r]));

              const isSuppressed = (r) => Array.isArray(r.suppressions) && r.suppressions.length > 0;
              const active     = allResults.filter(r => !isSuppressed(r));
              const suppressed = allResults.filter(r =>  isSuppressed(r));

              const hclFiles = [...new Set(
                allResults
                  .map(r => r.locations?.[0]?.physicalLocation?.artifactLocation?.uri)
                  .filter(Boolean)
              )];
              const resourceMap = buildResourceMap(hclFiles);

              const addressOf = (r) => {
                const loc  = r.locations?.[0] || {};
                const file = loc.physicalLocation?.artifactLocation?.uri || '';
                const line = loc.physicalLocation?.region?.startLine || 0;
                return (file && line) ? lookupAddress(resourceMap, file, line) : '(unknown)';
              };
              const lineOf = (r) =>
                r.locations?.[0]?.physicalLocation?.region?.startLine || '-';
              const descOf = (r) => {
                const rule = ruleById[r.ruleId] || {};
                return (rule.shortDescription?.text) || (rule.name) || (r.message?.text) || '';
              };

              if (active.length === 0) {
                summary += '### Checkov findings\n\n_No active findings._\n\n';
              } else {
                summary += `### Checkov findings (${active.length})\n\n`;
                summary += 'Checkov has found the following issues. These must be fixed before this PR can be merged to main.\n\n';
                summary += '| Rule | Resource | Line | Description |\n';
                summary += '|------|----------|------|-------------|\n';
                for (const r of active.slice(0, 30)) {
                  summary += `| \`${r.ruleId}\` | \`${addressOf(r)}\` | ${lineOf(r)} | ${descOf(r)} |\n`;
                }
                if (active.length > 30) {
                  summary += `\n_Showing first 30 of ${active.length}. See the **Security** tab for the full list._\n`;
                }
                summary += '\n';
              }

              if (suppressed.length > 0) {
                summary += `### Suppressed findings (${suppressed.length})\n\n`;
                summary += 'These checks were skipped by inline `# checkov:skip` comments and do **not** block merge. Inline suppressions are audited by the security team on a regular basis.\n\n';
                summary += '| Rule | Resource | Line | Justification |\n';
                summary += '|------|----------|------|---------------|\n';
                for (const r of suppressed.slice(0, 30)) {
                  const just = (r.suppressions?.[0]?.justification) || '(no reason given)';
                  summary += `| \`${r.ruleId}\` | \`${addressOf(r)}\` | ${lineOf(r)} | ${just} |\n`;
                }
                if (suppressed.length > 30) {
                  summary += `\n_Showing first 30 of ${suppressed.length}._\n`;
                }
                summary += '\n';
              }
            }

            summary += 'Full findings also uploaded to the **Security** tab under category `checkov`.';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary,
            });