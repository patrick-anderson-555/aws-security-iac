# Layer 2 of the IaC security gate.
#
# Runs on every PR touching Terraform code. Produces three artifacts:
#   1. terraform fmt/validate/plan output   (correctness and formatting)
#   2. Checkov SARIF results                (security findings in the Security tab)
#   3. PR comment summarising the above     (reviewer convenience)

name: terraform-plan

on:
  pull_request:
    paths:
      - 'environments/**'
      - 'modules/**'

permissions:
  id-token: write        # required to request the OIDC token from GitHub
  contents: read         # required to check out the PR branch
  pull-requests: write   # required to post the plan summary as a PR comment
  security-events: write # required to upload Checkov SARIF to the Security tab

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'
  WORKING_DIR: environments/dev

jobs:
  plan:
    name: terraform plan + checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region:    ${{ vars.AWS_REGION }}
          role-session-name: gha-terraform-plan-${{ github.run_id }}

      - name: terraform fmt
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -lockfile=readonly

      - name: terraform validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: terraform plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan -out=tfplan -no-color -input=false
          terraform show -json tfplan > tfplan.json

      - name: Run Checkov against HCL
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false
          quiet: true

      - name: Upload Checkov SARIF to GitHub Security tab
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: Post plan summary on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const planPath = '${{ env.WORKING_DIR }}/tfplan.json';
            const sarifPath = 'checkov.sarif';

            // Build a map of {file → [{startLine, endLine, address}]} by
            // parsing each HCL file referenced by any finding. For each
            // "resource <type> <name> {" declaration, we track the opening
            // brace and count braces until we find the matching close.
            // Strings and heredocs that happen to contain braces are a
            // known edge case; good enough for typical Terraform.
            function buildResourceMap(hclFiles) {
              const map = {};
              for (const file of hclFiles) {
                if (!fs.existsSync(file)) continue;
                const lines = fs.readFileSync(file, 'utf8').split('\n');
                const resources = [];
                let i = 0;
                while (i < lines.length) {
                  const m = lines[i].match(/^resource\s+"([^"]+)"\s+"([^"]+)"\s*\{/);
                  if (m) {
                    const address = `${m[1]}.${m[2]}`;
                    const startLine = i + 1; // 1-indexed
                    let depth = 1;
                    let j = i;
                    while (depth > 0 && j < lines.length - 1) {
                      j++;
                      for (const ch of lines[j]) {
                        if (ch === '{') depth++;
                        else if (ch === '}') depth--;
                        if (depth === 0) break;
                      }
                    }
                    const endLine = j + 1;
                    resources.push({ startLine, endLine, address });
                    i = j + 1;
                  } else {
                    i++;
                  }
                }
                map[file] = resources;
              }
              return map;
            }

            function lookupAddress(resourceMap, file, line) {
              const resources = resourceMap[file] || [];
              for (const r of resources) {
                if (line >= r.startLine && line <= r.endLine) return r.address;
              }
              return '(unknown)';
            }

            let summary = '## Terraform plan + Checkov\n\n';

            // --- Plan summary ---
            if (fs.existsSync(planPath)) {
              const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
              const changes = (plan.resource_changes || []).reduce((acc, c) => {
                for (const a of c.change.actions) acc[a] = (acc[a] || 0) + 1;
                return acc;
              }, {});
              summary += `**Resource actions:** \`${JSON.stringify(changes)}\`\n\n`;
            } else {
              summary += '_terraform plan did not produce a JSON file; see job logs._\n\n';
            }

            // --- Checkov findings table ---
            if (fs.existsSync(sarifPath)) {
              const sarif = JSON.parse(fs.readFileSync(sarifPath, 'utf8'));
              const results = (sarif.runs?.[0]?.results) || [];
              const rules   = (sarif.runs?.[0]?.tool?.driver?.rules) || [];
              const ruleById = Object.fromEntries(rules.map(r => [r.id, r]));

              // Collect every HCL file referenced by any finding so we only
              // parse what we actually need.
              const hclFiles = [...new Set(
                results
                  .map(r => r.locations?.[0]?.physicalLocation?.artifactLocation?.uri)
                  .filter(Boolean)
              )];
              const resourceMap = buildResourceMap(hclFiles);

              if (results.length === 0) {
                summary += '### Checkov findings\n\n_No findings._\n\n';
              } else {
                summary += `### Checkov findings (${results.length})\n\n`;
                summary += 'Checkov has found the following issues. These must be fixed before this PR can be merged to main.\n\n';
                summary += '| Rule | Resource | Line | Description |\n';
                summary += '|------|----------|------|-------------|\n';
                for (const r of results.slice(0, 30)) {
                  const rule = ruleById[r.ruleId] || {};
                  const desc = (rule.shortDescription?.text) || (rule.name) || '';

                  const loc = r.locations?.[0] || {};
                  const file = loc.physicalLocation?.artifactLocation?.uri || '';
                  const line = loc.physicalLocation?.region?.startLine || 0;
                  const address = file && line ? lookupAddress(resourceMap, file, line) : '(unknown)';

                  summary += `| \`${r.ruleId}\` | \`${address}\` | ${line || '-'} | ${desc} |\n`;
                }
                if (results.length > 30) {
                  summary += `\n_Showing first 30 of ${results.length}. See the **Security** tab for the full list._\n`;
                }
                summary += '\n';
              }
            }

            summary += 'Full findings also uploaded to the **Security** tab under category `checkov`.';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary,
            });